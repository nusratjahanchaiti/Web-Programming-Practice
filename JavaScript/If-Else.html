<!DOCTYPE html>
<html>
<head>
    <title>If Else Example</title>
</head>
<body>

<h2>Check Age</h2>
<p id="demo"></p>

<script>
let age = 17;

if (age >= 18) {
    document.getElementById("demo").innerHTML = "Adult";
} else {
    document.getElementById("demo").innerHTML = "Minor";
}

</script>

</body>
</html>
