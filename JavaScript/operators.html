<!DOCTYPE html>
<html>
<head>
    <title>Operators Example</title>
</head>
<body>

<h2>Operator Example</h2>
<p id="result"></p>

<script>
let x = 5;
let y = 3;

let output = "";
output += "x + y = " + (x + y) + "<br>";
output += "x - y = " + (x - y) + "<br>";
output += "x * y = " + (x * y) + "<br>";
output += "x / y = " + (x / y) + "<br>";

document.getElementById("result").innerHTML = output;
</script>

</body>
</html>
