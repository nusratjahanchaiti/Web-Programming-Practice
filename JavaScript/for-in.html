<!DOCTYPE html>
<html>
<body>

<h2>3 Persons Details</h2>

<script>
// Array of 3 person objects
const persons = [
    {name:"John", age:25, city:"London"},
    {name:"Sara", age:22, city:"New York"},
    {name:"Mike", age:30, city:"Germany"}
];

// Loop through each person
for (let i in persons) {
    const person = persons[i]; // single 'person' object in each loop
    console.log("Name:", person.name);
    console.log("Age:", person.age);
    console.log("City:", person.city);
    console.log(""); // prints an empty line
    
}
