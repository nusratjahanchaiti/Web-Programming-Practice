<!DOCTYPE html>
<html>
<head>
<title>Sticky Example</title>
<style>
.container {
  height: 200px;
  width: 300px;
  margin: 20%;
  overflow: scroll;
  border: 1px solid black;
}
h1,h2,p {
  height: 50px;
  border: 1px solid black;
  margin: 0;
}
h1 { background-color: red; }
h2 { 
  background-color: green; 
  position: sticky;
  top: 0;
}
p { background-color: blue; color: white; }
</style>
</head>
<body>

<div class="container">
  <h1>Hello</h1>
  <h2>Welcome to CSS</h2>
  <p>It is very conceptual tech</p>
  <p>It is very conceptual tech</p>
  <p>It is very conceptual tech</p>
  <p>It is very conceptual tech</p>
</div>

</body>
</html>
