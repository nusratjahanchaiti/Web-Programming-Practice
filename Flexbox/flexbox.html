<!DOCTYPE html>
<html>
<head>
<title>Flexbox Example</title>
<style>
.container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  border: 2px solid black;
  padding: 10px;
}
.item {
  width: 100px;
  height: 100px;
  background: lightblue;
  margin: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}
</style>
</head>
<body>

<h2>Flexbox Example</h2>
<div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>

</body>
</html>
