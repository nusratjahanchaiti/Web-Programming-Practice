<!DOCTYPE html>
<html>
<head>
<title>Absolute Positioning</title>
<style>
.container {
  position: relative;
  width: 300px;
  height: 300px;
  border: 1px solid black;
  margin: 20px 0;
  padding: 10px;
}
#box2 {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 100px;
  height: 100px;
  background: pink;
  text-align: center;
  line-height: 100px;
}
.box {
  height: 50px;
  margin: 5px 0;
  background: lightblue;
  text-align: center;
  line-height: 50px;
}
</style>
</head>
<body>

<h2>Absolute Positioning</h2>
<div class="container">
  <div class="box">Box 1</div>
  <div id="box2">Box 2 (Absolute)</div>
  <div class="box">Box 3</div>
</div>

</body>
</html>
