<!DOCTYPE html>
<html>
<head>
<title>Relative Positioning</title>
<style>
#box2 {
  position: relative;
  top: 20px;
  left: 20px;
  width: 100px;
  height: 100px;
  background: orange;
  text-align: center;
  line-height: 100px;
}
.box {
  height: 120px;
  margin: 5px 0;
  background: lightblue;
  text-align: center;
  line-height: 120px;
}
</style>
</head>
<body>

<div class="box">Box 1</div>
<div id="box2">Box 2 (Relative)</div>
<div class="box" style="background: lightgreen;">Box 3</div>

</body>
</html>
