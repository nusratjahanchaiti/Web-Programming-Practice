<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Light Switch</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: #f0f8ff;
    padding: 50px;
  }

  h2 {
    color: #333;
    text-shadow: 1px 1px 2px #aaa;
  }

  p {
    color: #555;
    font-size: 1.1em;
  }

  #myImage {
    width: 120px;
    margin: 20px 0;
    transition: transform 0.3s ease;
  }

  #myImage:hover {
    transform: scale(1.2);
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    font-size: 1em;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #45a049;
    transform: scale(1.1);
  }

  button.off {
    background-color: #f44336;
  }

  button.off:hover {
    background-color: #e53935;
  }
</style>
</head>
<body>

<img id="myImage" src="pic_bulboff.gif" alt="Light bulb">

<br>

<button onclick="document.getElementById('myImage').src='pic_bulbon.gif'">Turn On</button>
<button class="off" onclick="document.getElementById('myImage').src='pic_bulboff.gif'">Turn Off</button>

</body>
</html>
