<!DOCTYPE html>
<html>
<head>
    <title>Single Table Multiple Rows</title>
</head>
<body>

<h2>Student Table</h2>

<table border="1">
    <!-- Table Heading Row -->
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
    </tr>

    <!-- Row 1 -->
    <tr>
        <td>1</td>
        <td>Nusrat</td>
        <td>20</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td>2</td>
        <td>Rahim</td>
        <td>22</td>
    </tr>

    <!-- Row 3 -->
    <tr>
        <td>3</td>
        <td>Karim</td>
        <td>21</td>
    </tr>
</table>

<h2>Student Marks Table</h2>

<table border="1">
    <!-- Heading row -->
    <tr>
        <th rowspan="2">Name</th> <!-- Merges 2 rows vertically -->
        <th colspan="2">Marks</th> <!-- Merges 2 columns horizontally -->
    </tr>
    <!-- Subheading row -->
    <tr>
        <th>Math</th>
        <th>Science</th>
    </tr>
    <!-- First student -->
    <tr>
        <td>Nusrat</td>
        <td>85</td>
        <td>90</td>
    </tr>
    <!-- Second student -->
    <tr>
        <td>Rahim</td>
        <td>78</td>
        <td>82</td>
    </tr>
</table>

</body>
</html>
