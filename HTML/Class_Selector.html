<!DOCTYPE html>
<html>
<head>
<style>
.city {
  background-color: tomato;
  color: white;
  border: 2px solid black;
  margin: 20px;
  padding: 20px;
}
.city1 {
  background-color: Green;
  color: white;
  border: 2px solid black;
  margin: 20px;
  padding: 20px;
}
.city2 {
  background-color: yellow;
  color: white;
  border: 2px solid black;
  margin: 20px;
  padding: 20px;
}
</style>
</head>
<body>

<div class="city">
<h2>London</h2>
<p>London is the capital of England.</p>
</div> 

<div class="city1">
<h2>Paris</h2>
<p>Paris is the capital of France.</p>
</div>

<div class="city2">
<h2>Tokyo</h2>
<p>Tokyo is the capital of Japan.</p>
</div>

</body>
</html>

<!-- applies the same styles (margin, padding, border, text color) to all three divs. -->
 
<!DOCTYPE html>
<html>
<head>
<style>
/* Common styles for all cities */
.city, .city1, .city2 {
  color: white;
  border: 2px solid black;
  margin: 20px;
  padding: 20px;
}

/* Individual background colors */
.city { background-color: tomato; }
.city1 { background-color: green; }
.city2 { background-color: yellow; }
</style>
</head>
<body>

<div class="city">
  <h2>London</h2>
  <p>London is the capital of England.</p>
</div> 

<div class="city1">
  <h2>Paris</h2>
  <p>Paris is the capital of France.</p>
</div>

<div class="city2">
  <h2>Tokyo</h2>
  <p>Tokyo is the capital of Japan.</p>
</div>

</body>
</html>
