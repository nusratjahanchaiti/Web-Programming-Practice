<!DOCTYPE html>
<html>
<head>
    <title>Full Class Routine</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .break {
            background-color: #ffcccb;
        }
    </style>
</head>
<body>

<h2 align="center">Weekly Class Routine</h2>

<table>
    <tr>
        <th>Day / Time</th>
        <th>9-10</th>
        <th>10-11</th>
        <th>11-12</th>
        <th>12-1</th>
        <th>1-2</th>
    </tr>

    <tr>
        <td>Sunday</td>
        <td rowspan="2">Math</td>
        <td>Physics</td>
        <td>CSE</td>
        <td class="break">Break</td>
        <td>English</td>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Database</td>
        <td>OS</td>
        <td class="break">Break</td>
        <td>Software Eng.</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>Physics</td>
        <td colspan="2">CSE</td>
        <td class="break">Break</td>
        <td>Math</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>OS</td>
        <td>Database</td>
        <td>Software Eng.</td>
        <td class="break">Break</td>
        <td>Physics</td>
    </tr>

    <tr>
        <td>Thursday</td>
        <td>AI</td>
        <td>Math</td>
        <td>English</td>
        <td class="break">Break</td>
        <td>Database</td>
    </tr>

</table>

</body>
</html>
