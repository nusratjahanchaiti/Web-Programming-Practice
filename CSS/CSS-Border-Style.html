<!DOCTYPE html>
<html>
<head>
<style>
p.solid { border-style: solid; border-width: 2px; padding: 10px; }
p.double { border-style: double; border-width: 4px; padding: 10px; }
p.groove { border-style: groove; border-width: 4px; padding: 10px; }
p.dotted { border-style: dotted; border-width: 2px; padding: 10px; }
p.dashed { border-style: dashed; border-width: 2px; padding: 10px; }
p.inset { border-style: inset; border-width: 4px; padding: 10px; }
p.outset { border-style: outset; border-width: 4px; padding: 10px; }
p.ridge { border-style: ridge; border-width: 4px; padding: 10px; }
p.hidden { border-style: hidden; border-width: 4px; padding: 10px; }
p.specific {
  border-top-style: dotted;
  border-right-style: solid;
  border-bottom-style: dotted;
  border-left-style: solid;
  border-width: 2px;
  padding: 10px;
}
</style>
</head>
<body>

<h2>CSS Borders Demo</h2>
<p class="solid">Solid Border</p>
<p class="double">Double Border</p>
<p class="groove">Groove Border</p>
<p class="dotted">Dotted Border</p>
<p class="dashed">Dashed Border</p>
<p class="inset">Inset Border</p>
<p class="outset">Outset Border</p>
<p class="ridge">Ridge Border</p>
<p class="hidden">Hidden Border</p>
<p class="specific">Specific Side Borders</p>

</body>
</html>
