<!DOCTYPE html>
<html>
<head>
<style>
a:link { color: blue; text-decoration: none; }
a:visited { color: purple; }
a:hover { color: red; }
a:active { color: orange; }
</style>
</head>
<body>

<h2>CSS Links Demo</h2>
<p>
  <a href="#">Normal Link</a> |
  <a href="#">Hover Me</a> |
  <a href="#">Click Me</a>
</p>

</body>
</html>
