<!DOCTYPE html>
<html>
<head>
<style>
#container {
  width: 300px;
  padding: 20px 10px 30px 12px; /* top right bottom left */
  margin: 0px 5px 6px 5px;
  border: 2px solid black;
  background-color: lightyellow;
}
#box {
  width: 300px;
  padding: 20px;
  border: 5px solid black;
  box-sizing: border-box; /* includes padding & border */
  background-color: lightcyan;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<h2>Standard Box Model</h2>
<div id="container">
  Container with padding, margin, and border
</div>

<h2>Border-Box Model</h2>
<div id="box">
  Box with border-box model
</div>

</body>
</html>
