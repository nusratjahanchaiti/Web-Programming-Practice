<!DOCTYPE html>
<html>
<head>
<style>
ol {
  list-style-type: decimal;
  padding-left: 20px;
}
ul {
  list-style-type: square; /* disc, circle, square */
  padding-left: 20px;
}
</style>
</head>
<body>

<h2>Ordered List</h2>
<ol>
  <li>Apple</li>
  <li>Banana</li>
  <li>Cherry</li>
</ol>
<h2>Unordered List</h2>
<ul>
  <li>Cat</li>
  <li>Dog</li>
  <li>Rabbit</li>
</ul>

</body>
</html>
